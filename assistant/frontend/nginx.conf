server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the host backend to avoid CORS issues when the UI is served from the container.
  # Docker Desktop provides host.docker.internal which resolves to the host machine.
  # Proxy all /speech paths to host backend
  location ^~ /speech {
    proxy_pass http://host.docker.internal:8000;
    proxy_set_header Host host.docker.internal:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect http://host.docker.internal:8000/ /;
    proxy_redirect http://127.0.0.1:8000/ /;
    proxy_redirect http://127.0.0.1/ /;
  }

  # Proxy all /chat paths to host backend
  location ^~ /chat {
    proxy_pass http://host.docker.internal:8000;
    proxy_set_header Host host.docker.internal:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect http://host.docker.internal:8000/ /;
    proxy_redirect http://127.0.0.1:8000/ /;
    proxy_redirect http://127.0.0.1/ /;
  }

  # Proxy all /vision paths to host backend
  location ^~ /vision {
    proxy_pass http://host.docker.internal:8000;
    proxy_set_header Host host.docker.internal:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect http://host.docker.internal:8000/ /;
    proxy_redirect http://127.0.0.1:8000/ /;
    proxy_redirect http://127.0.0.1/ /;
  }

  # disable access logs if you prefer
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}
